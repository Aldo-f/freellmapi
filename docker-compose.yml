services:
  freellmapi:
    image: freellmapi:local-001
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST_BIND: 0.0.0.0
    ports:
      - "3001:3001"
    volumes:
      - freellmapi-data:/app/server/data
      - ./.env.template:/app/server/.env:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/ping').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - traefik_net

networks:
  traefik_net:
    external: true

volumes:
  freellmapi-data: